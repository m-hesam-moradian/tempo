<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 380" width="1200" height="380" role="img" aria-label="TEMPO - Your workout. Your tempo." xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1f2b35"/>
      <stop offset="1" stop-color="#141d25"/>
    </linearGradient>
    <linearGradient id="btn" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#5EEAD4"/>
      <stop offset="1" stop-color="#4FD1C7"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#4FD1C7" stop-opacity="0.35"/>
      <stop offset="1" stop-color="#4FD1C7" stop-opacity="0"/>
    </radialGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="8" dy="8" stdDeviation="10" flood-color="#000" flood-opacity="0.55"/>
      <feDropShadow dx="-6" dy="-6" stdDeviation="8" flood-color="#506d7d" flood-opacity="0.10"/>
    </filter>
  </defs>
  <rect width="1200" height="380" rx="28" fill="#1a242c"/>
  <circle cx="600" cy="150" r="260" fill="url(#glow)"/>
  <rect x="40" y="40" width="1120" height="300" rx="28" fill="url(#bg)" filter="url(#shadow)"/>

  <!-- logo ring -->
  <g transform="translate(600 112) scale(3.2)" fill="none" stroke="#5EEAD4" stroke-width="1.5" stroke-linecap="round">
    <circle cx="0" cy="0" r="9"/><circle cx="0" cy="0" r="5"/>
    <circle cx="0" cy="0" r="1.5" fill="#5EEAD4" stroke="none"/>
    <path d="M0 -9 L0 -7"/><path d="M0 7 L0 9"/><path d="M-9 0 L-7 0"/><path d="M7 0 L9 0"/>
  </g>

  <text x="600" y="228" text-anchor="middle" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="68" font-weight="800" letter-spacing="14" fill="#4FD1C7">TEMPO</text>
  <text x="600" y="268" text-anchor="middle" font-family="'JetBrains Mono', 'Courier New', monospace" font-size="16" letter-spacing="6" fill="#8a9aab">YOUR WORKOUT. YOUR TEMPO.</text>

  <!-- pills -->
  <g font-family="'JetBrains Mono', 'Courier New', monospace" font-size="13" letter-spacing="2" text-anchor="middle">
    <rect x="316" y="292" width="170" height="30" rx="15" fill="#141d25"/>
    <text x="401" y="312" fill="#5EEAD4">NO BACKEND</text>
    <rect x="502" y="292" width="170" height="30" rx="15" fill="#141d25"/>
    <text x="587" y="312" fill="#F6A623">NO LOGIN</text>
    <rect x="688" y="292" width="196" height="30" rx="15" fill="#141d25"/>
    <text x="786" y="312" fill="#A78BFA">NO NONSENSE</text>
  </g>
</svg>
